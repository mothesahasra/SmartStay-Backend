# ===========================================
# SmartStay - Production Profile
# ===========================================

# Database (from environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/smartstay_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://smartstay.com}

# JWT (override secret in production)
app.jwt.secret=${JWT_SECRET}

# File Storage
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.smartstay=INFO
logging.level.org.springframework.security=WARN
