# ===========================================
# SmartStay - Production Profile
# ===========================================

# Server
server.port=${PORT:8080}

# Database (supports MySQL and PostgreSQL via standard JDBC URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/smartstay_db}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# JPA / Hibernate (auto-creates tables in new cloud database)
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://smart-stay-frontend-omega.vercel.app}

# JWT (with secure fallback default)
app.jwt.secret=${JWT_SECRET:c21hcnRzdGF5LXNlY3VyZS1qd3Qtc2VjcmV0LWtleS1mb3ItdG9rZW4tZ2VuZXJhdGlvbi1hbmQtdmFsaWRhdGlvbi0yMDI0LXByb2R1Y3Rpb24tcmVhZHk=}

# File Storage
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging
logging.level.com.smartstay=INFO
logging.level.org.springframework.security=WARN
