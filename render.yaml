databases:
  - name: smartstay-db
    plan: free
    databaseName: smartstay_db
    user: smartstay_user

services:
  - type: web
    name: smartstay-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: smartstay-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: smartstay-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: smartstay-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: smartstay-db
          property: password
      - key: JWT_SECRET
        value: c21hcnRzdGF5LXNlY3VyZS1qd3Qtc2VjcmV0LWtleS1mb3ItdG9rZW4tZ2VuZXJhdGlvbi1hbmQtdmFsaWRhdGlvbi0yMDI0LXByb2R1Y3Rpb24tcmVhZHk=
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-stay-frontend-omega.vercel.app
